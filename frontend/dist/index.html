<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOLMZ 근로 종합 관리</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="brand">HOLMZ</div>
    <p class="hint">이름과 학번(관리자는 PIN)을 입력해 접속하세요.</p>
    <input type="text" id="login-name" placeholder="이름" autocomplete="off">
    <input type="password" id="login-secret" placeholder="학번 / PIN">
    <button id="login-btn" class="small primary">접속</button>
    <p id="login-err" class="error" style="display:none"></p>
  </div>
</div>
<nav id="nav">
  <div class="brand">HOLMZ</div>
  <button data-view="dashboard" class="active"><span class="ico">◫</span>대시보드</button>
  <button data-view="worklog"><span class="ico">◷</span>근로기록</button>
  <button data-view="checklist-open"><span class="ico">☐</span>오픈 체크리스트</button>
  <button data-view="checklist-close"><span class="ico">☐</span>마감 체크리스트</button>
  <div class="nav-sep">관리자</div>
  <button data-view="admin-worklog"><span class="ico">◷</span>근로기록 관리</button>
  <button data-view="admin-shifts"><span class="ico">▤</span>근로 스케줄</button>
  <button data-view="admin-schedule"><span class="ico">▦</span>스케줄 관리</button>
  <button data-view="admin-player"><span class="ico">▷</span>영상 재생</button>
  <button data-view="admin-checklist"><span class="ico">☑</span>체크리스트 관리</button>
  <button data-view="admin-employees"><span class="ico">◎</span>직원 관리</button>
  <button data-view="admin-settings"><span class="ico">⚙</span>설정 (Google 연동)</button>
</nav>
<main id="main">
  <header id="topbar">
    <button id="side-toggle" class="ghost" title="사이드바 숨기기/보이기">▤ 사이드바</button>
    <span id="today"></span>
    <div class="spacer"></div>
    <button id="theme-toggle" class="ghost" title="테마 전환">◐ 다크</button>
    <span id="whoami" class="hint"></span>
    <label class="emp">근무자
      <select id="employee-select"></select>
    </label>
    <button id="logout" class="ghost" title="로그아웃">로그아웃</button>
  </header>
  <section id="view"></section>
</main>
<script src="/app.js"></script>
</body>
</html>
